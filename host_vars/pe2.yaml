# host_vars/pe2.yaml
hostname: PE2
role: pe
iou: 4
domain_name: lab.local

mgmt:
  vrf: Mgmt-intf
  interface: Ethernet1/3
  ip: 10.1.1.4
  mask: 255.255.255.0
  gateway: 10.1.1.254

loopback:
  ip: 4.4.4.4
  mask: 255.255.255.255
  ospf:
    process: 1
    area: 0

ospf:
  process_id: 1
  router_id: 4.4.4.4
  reference_bandwidth: 1000000
  passive_interfaces:
    - Ethernet1/0

vrfs:
  - name: VRF_A
    rd: "65:65001"
    rt_export: "65:65001"
    rt_import: "65:65001"

interfaces:
  - name: Ethernet0/0
    description: "link to P2"
    ip: 10.3.4.4
    mask: 255.255.255.0
    ospf:
      process: 1
      area: 0
      network_type: point-to-point

  - name: Ethernet1/0
    description: "VRF A to CE2"
    ip: 172.1.48.4
    mask: 255.255.255.0
    vrf: VRF_A