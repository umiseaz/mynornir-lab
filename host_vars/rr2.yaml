# host_vars/rr2.yaml
hostname: RR2
loopback_name: Loopback0
role: rr
iou: 6

domain_name: lab.local

mgmt:
  vrf: Mgmt-intf
  interface: Ethernet1/3
  ip: 10.1.1.6
  mask: 255.255.255.0
  gateway: 10.1.1.254

ospf:
  process_id: 1
  router_id: 6.6.6.6
  reference_bandwidth: 1000000
  passive_interfaces:
    - Loopback0

interfaces:
  - name: Loopback0
    description: "Router ID"
    ip: 6.6.6.6
    mask: 255.255.255.255
    ospf:
      process: 1
      area: 0
  - name: Ethernet0/2
    description: "link to P2"
    ip: 10.3.6.6
    mask: 255.255.255.0
    ospf:
      process: 1
      area: 0
      network_type: point-to-point