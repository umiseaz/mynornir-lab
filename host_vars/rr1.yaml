# host_vars/rr1.yaml
hostname: RR1
loopback_name: Loopback0
role: rr
iou: 5

domain_name: lab.local

mgmt:
  vrf: Mgmt-intf
  interface: Ethernet1/3
  ip: 10.1.1.5
  mask: 255.255.255.0
  gateway: 10.1.1.254

ospf:
  process_id: 1
  router_id: 5.5.5.5
  reference_bandwidth: 1000000.
  passive_interfaces:
    - Loopback0

interfaces:
  - name: Loopback0
    description: "Router ID"
    ip: 5.5.5.5
    mask: 255.255.255.255
    ospf:
      process: 1
      area: 0
  - name: Ethernet0/2
    description: "link to P1"
    ip: 10.2.5.5
    mask: 255.255.255.0
    mpls: true
    ospf:
      process: 1
      area: 0
      network_type: point-to-point