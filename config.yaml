# Nornir configuration — single source of truth for inventory + runner.
# Paths are relative to the repo root; scripts chdir(BASE_DIR) before init.
---
inventory:
  plugin: SimpleInventory
  options:
    host_file: "inventory/hosts.yaml"
    group_file: "inventory/groups.yaml"
    defaults_file: "inventory/defaults.yaml"

runner:
  plugin: threaded
  options:
    num_workers: 10
